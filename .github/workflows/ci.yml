name: Visitflow CI Pipeline

on:
  workflow_call:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Frontend CI: Linting, TypeScript Typecheck & Production Vite Build
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend (React & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: https://api.visitflow.lk/api

      - name: Archive production bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Backend CI: PHP Lint, Dependencies, In-Memory DB & Feature Test Suite
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend (Laravel 11 & PHP 8.2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3, bcmath, fileinfo, gd
          coverage: none

      - name: Validate composer.json & composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Prepare testing environment
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Run PHP Syntax Check on Application Code
        run: find app bootstrap routes tests -name "*.php" -exec php -l {} \; > /dev/null

      - name: Execute PHPUnit / Pest Test Suite
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          CLOUDINARY_ENABLED: false
        run: php artisan test
